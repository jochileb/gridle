<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,800&display=swap">
<style>
/* Layout: home screen (hero, daily play button, recent form calendar), then one round at a time after a start-lights countdown, then a results screen. Countdown to the next daily game at the bottom. Rarer answers score more. */
:root {
  --bg: #0c0c10;
  --surface: #15151c;
  --surface-2: #1d1d26;
  --ink: #f2f2ef;
  --muted: #9b9ba8;
  --line: #2b2b36;
  --red: #ff3b30;
  --on-red: #ffffff;
  --green: #2ee08a;
  --on-green: #06210f;
  --t1: #9b9ba8;
  --t2: #6ab0ff;
  --t3: #2ee08a;
  --t4: #b78cff;
  --t5: #ffd24a;
  --dot: rgba(255, 255, 255, .06);
  --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1f1ee; --surface: #ffffff; --surface-2: #e9e9e5; --ink: #15151c; --muted: #62626f;
    --line: #d4d4cf; --red: #e10600; --on-red: #ffffff; --green: #0b8a4a; --on-green: #ffffff;
    --t1: #62626f; --t2: #1f6fd1; --t3: #0b8a4a; --t4: #7a3fd1; --t5: #a8740a; --dot: rgba(0, 0, 0, .06);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1f1ee; --surface: #ffffff; --surface-2: #e9e9e5; --ink: #15151c; --muted: #62626f;
  --line: #d4d4cf; --red: #e10600; --on-red: #ffffff; --green: #0b8a4a; --on-green: #ffffff;
  --t1: #62626f; --t2: #1f6fd1; --t3: #0b8a4a; --t4: #7a3fd1; --t5: #a8740a; --dot: rgba(0, 0, 0, .06);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body);
  padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mark { font: italic 800 2.6rem/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; margin: 0; }
.mark span { color: var(--red); }
.tag { color: var(--muted); font-size: .9rem; margin: 6px 0 0; max-width: 38ch; }
.total { text-align: right; margin: 0; }
.total b { display: block; font: italic 800 2.2rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.total span { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.step { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.step i { height: 5px; border-radius: 2px; background: var(--line); }
.step span { font: 600 .72rem/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.step.done i { background: var(--tc); }
.step.done span, .step.cur span { color: var(--ink); }
.step.cur i { background: var(--red); }
.btn:focus-visible, .chip:focus-visible, summary:focus-visible, .cta:focus-visible, .cal-nav button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.head > div { min-width: 0; flex: 1 1 260px; }
.head > div.lightbox { flex: 0 0 auto; }
.eyebrow { font: 600 .75rem/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
h2 { font: italic 800 clamp(1.6rem, 5vw, 2.1rem)/1.05 var(--font-display); text-transform: uppercase; margin: 0 0 8px; text-wrap: balance; }
.prompt { margin: 0; }
.lights { display: flex; gap: 6px; padding: 8px 10px; background: #050507; border-radius: 6px; }
.lights.big { align-self: center; gap: 12px; padding: 16px 20px; margin: 8px 0 12px; }
.lamp { width: 22px; height: 22px; border-radius: 50%; background: #2a1514; border: 1px solid #3a1d1b; }
.lights.big .lamp { width: 38px; height: 38px; }
.lamp.on { background: #ff2a1f; border-color: #ff6a60; box-shadow: 0 0 10px 2px rgba(255, 42, 31, .6); }
.clock { font: italic 800 1.8rem/1 var(--font-display); text-align: right; margin: 0; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--red); }
.clock small { font: 600 .7rem var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-style: normal; margin-left: 4px; }
.timebar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.timebar i { display: block; height: 100%; width: 100%; background: var(--green); transition: width .25s linear; }
.timebar.low i { background: var(--red); }
.score { font: italic 800 2rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score small { font: 500 .85rem var(--font-body); color: var(--muted); font-style: normal; margin-left: 6px; }
form { position: relative; display: flex; gap: 8px; }
input[type="text"] {
  flex: 1; min-width: 0; font: 500 1rem var(--font-body); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px;
}
input[type="text"]:focus-visible { outline: 2px solid var(--red); outline-offset: 0; border-color: var(--red); }
.btn {
  appearance: none; cursor: pointer; font: 600 .9rem var(--font-body); letter-spacing: .06em; text-transform: uppercase;
  color: var(--on-red); background: var(--red); border: 1px solid var(--red); border-radius: 2px; padding: 0 18px;
}
.btn.big { padding: 14px 28px; align-self: flex-start; font-size: 1rem; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); padding: 10px 16px; }
.btn.ghost:hover { border-color: var(--muted); }
.btn.small { padding: 8px 14px; }
.msg { min-height: 1.5em; margin: 0; color: var(--muted); font-size: .95rem; }
.msg.bad { color: var(--red); }
.msg.good { color: var(--green); }
.didyou { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-radius: 2px; font-weight: 500; }
.didyou[hidden] { display: none; }
ol.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.pos { font: italic 700 1.05rem/1 var(--font-display); text-align: center; padding: 6px 0; background: var(--surface-2); color: var(--muted); border-radius: 2px; font-variant-numeric: tabular-nums; }
.name { font: 600 1.05rem/1.2 var(--font-body); min-width: 0; overflow-wrap: anywhere; }
.name small { display: block; font: 400 .8rem/1.3 var(--font-body); color: var(--muted); margin-top: 2px; }
.mask { display: block; height: 10px; width: 55%; max-width: 220px; background: var(--surface-2); border-radius: 2px; }
.pts { font: italic 800 1.35rem/1 var(--font-display); text-align: right; font-variant-numeric: tabular-nums; min-width: 4.4rem; }
.pts small { display: block; font: 600 .62rem/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-style: normal; }
.row.hit .pos { background: var(--green); color: var(--on-green); }
.row.miss .pos { background: var(--red); color: var(--on-red); }
.row.miss .pts { color: var(--red); }
.row.other .name, .row.other .pts { color: var(--muted); }
.finish { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px; background: var(--surface-2); border-radius: 2px; }
.finish p { margin: 0; flex: 1 1 200px; font-weight: 500; }
.flag { width: 44px; height: 30px; flex: none; border: 1px solid var(--line);
  background: conic-gradient(var(--ink) 25%, var(--bg) 0 50%, var(--ink) 0 75%, var(--bg) 0) 0 0 / 14px 14px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }

/* Home */
.home { display: flex; flex-direction: column; align-items: center; gap: 36px; }
.hero { width: 100%; text-align: center; padding: 36px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 18px;
  background: radial-gradient(circle, var(--dot) 1.5px, transparent 1.5px) 0 0 / 16px 16px; border-radius: 6px; }
.live { display: inline-flex; align-items: center; gap: 8px; font: 600 .72rem/1 var(--font-body); letter-spacing: .2em; text-transform: uppercase; margin: 0; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.hero-title { font: 800 clamp(3.6rem, 16vw, 6.6rem)/.88 var(--font-display); margin: 6px 0 0; letter-spacing: -.01em; }
.hero-title em { display: block; font-style: italic; color: var(--red); }
.hero-sub { margin: 0; color: var(--muted); }
.cta { appearance: none; border: 0; cursor: pointer; width: 100%; max-width: 520px; margin-top: 8px; background: var(--red); color: var(--on-red);
  font: 700 1rem var(--font-body); padding: 18px 24px; border-radius: 6px; box-shadow: 0 5px 0 rgba(0, 0, 0, .35); display: flex; justify-content: center; align-items: center; gap: 10px; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
.form { width: 100%; max-width: 480px; border-top: 1px solid var(--line); padding-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.form-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.form-head h3 { margin: 0; font: 600 1.2rem var(--font-body); }
.strk { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 700; color: var(--t3); }
.strk small { color: var(--muted); font-weight: 400; font-size: .78rem; }
.cal-nav { display: flex; justify-content: space-between; align-items: center; font: 600 .7rem var(--font-body); letter-spacing: .1em; color: var(--muted); }
.cal-nav div { display: flex; gap: 6px; }
.cal-nav button { width: 32px; height: 26px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.cal-nav button:disabled { opacity: .3; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { font: 600 .6rem var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }
.day { aspect-ratio: 1.15; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); display: flex; flex-direction: column; justify-content: space-between; padding: 4px 6px; font-size: .62rem; color: var(--muted); min-width: 0; }
.day b { align-self: center; font: 700 .9rem var(--font-body); font-variant-numeric: tabular-nums; }
.day.future { opacity: .45; }
.day.today { border-style: dashed; border-color: var(--red); }
.day.played { background: color-mix(in srgb, var(--green) var(--p), var(--surface-2)); color: var(--ink); border-style: solid; border-color: transparent; }
.form-note { margin: 0; color: var(--muted); font-size: .8rem; }
.legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: .7rem; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: color-mix(in srgb, var(--green) var(--p), var(--surface-2)); }
.legend span.sp { margin-left: auto; }
.how { width: 100%; max-width: 480px; border-top: 1px solid var(--line); }
.how summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 16px 0; font-weight: 600; }
.how summary::-webkit-details-marker { display: none; }
.how summary i { width: 24px; height: 24px; border: 1px solid var(--red); border-radius: 50%; position: relative; color: var(--red); }
.how summary i::before, .how summary i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 2px; background: currentColor; transform: translate(-50%, -50%); }
.how summary i::after { transform: translate(-50%, -50%) rotate(90deg); }
.how[open] summary i::after { display: none; }
.how .mtext { padding-bottom: 16px; }

/* Results screen */
.results { display: flex; flex-direction: column; gap: 24px; }
.res-head { border: 1px solid var(--line); border-radius: 4px; padding: 28px 20px 24px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  background: var(--surface) radial-gradient(circle, var(--dot) 1.5px, transparent 1.5px) 0 0 / 16px 16px; }
.res-title { font: italic 800 clamp(2.6rem, 11vw, 4.4rem)/1 var(--font-display); text-transform: uppercase; margin: 0; color: var(--rc); }
.res-rank { font: 600 .8rem/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0; }
.res-score { font: italic 800 clamp(4.5rem, 24vw, 8rem)/.9 var(--font-display); color: var(--green); margin: 6px 0; font-variant-numeric: tabular-nums; }
.streak { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 10px; font-size: .9rem; font-weight: 600; background: var(--surface-2); margin: 0; }
.mini-flag { width: 16px; height: 12px; border: 1px solid var(--muted);
  background: conic-gradient(var(--ink) 25%, var(--surface-2) 0 50%, var(--ink) 0 75%, var(--surface-2) 0) 0 0 / 6px 6px; }
.cmp { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.pct { margin: 0; }
.pct b { font: 700 2rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pct span { color: var(--muted); font-size: .85rem; margin-left: 6px; }
.hist { position: relative; height: 140px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line); }
.bar { flex: 1; min-width: 0; border-radius: 1px 1px 0 0; opacity: .7; }
.bar.b-dts { background: var(--red); }
.bar.b-wheel { background: var(--t2); }
.bar.b-good { background: var(--t3); }
.bar.b-elite { background: var(--t4); }
.bar.you { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; }
.you-tag { position: absolute; transform: translateX(-50%); font: 700 .72rem/1 var(--font-body); background: var(--ink); color: var(--bg); padding: 3px 6px; border-radius: 2px; }
.axis { position: relative; height: 1.1rem; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; top: 0; transform: translateX(-50%); }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }
.sim { margin: 0; color: var(--muted); font-size: .78rem; }
.cards { display: flex; flex-direction: column; gap: 8px; }
details.card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--tc); border-radius: 4px; }
details.card summary { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; list-style: none; }
details.card summary::-webkit-details-marker { display: none; }
details.card summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 6px; flex: none; }
details.card[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.idx { width: 24px; height: 24px; border: 1px solid var(--muted); border-radius: 50%; font-size: .75rem; display: grid; place-items: center; color: var(--muted); flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); flex: none; }
.tname { font-weight: 600; color: var(--tc); min-width: 0; overflow-wrap: anywhere; }
.cpts { margin-left: auto; font: italic 800 1.5rem/1 var(--font-display); color: var(--tc); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cpts small { font: 500 .75rem var(--font-body); font-style: normal; margin-left: 3px; color: var(--muted); }
.cbody { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.cbody h3 { font: 700 clamp(1.3rem, 4.5vw, 1.7rem)/1.1 var(--font-display); margin: 4px 0 0; text-wrap: balance; }
.cbody p { margin: 0; font-size: .9rem; color: var(--muted); }
.cbody p b { color: var(--ink); font-weight: 600; }
.vh { font-weight: 600; font-size: .9rem; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; cursor: pointer; font: 600 .82rem var(--font-body); color: var(--tc); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.chip i { font-style: normal; color: var(--muted); margin-left: 4px; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--tc); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--tc); }
.vlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 20px; }
.vlist li { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: .92rem; min-width: 0; }
.vlist li span { overflow-wrap: anywhere; }
.vlist li small { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.vlist li.mine span { font-weight: 700; color: var(--tc); }

/* Countdown to the next game */
.next { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.next .eyebrow { margin: 0; font-size: .68rem; }
.cd { font: italic 800 clamp(1.4rem, 5.5vw, 1.8rem)/1 var(--font-display); font-variant-numeric: tabular-nums; margin: 0; }
.next small { color: var(--muted); font-size: .72rem; }

/* Top buttons */
.topbar { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: 600 .9rem var(--font-body); cursor: pointer; }
.pill:hover { border-color: var(--muted); }
.pill:focus-visible, .mi:focus-visible, .xbtn:focus-visible, .back:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .62); display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay[hidden] { display: none; }
.modal { position: relative; width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px 24px; }
.modal h2 { font: 800 clamp(1.8rem, 7vw, 2.3rem)/1 var(--font-display); text-transform: uppercase; margin: 0 44px 18px 0; }
.xbtn { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink); cursor: pointer; font-size: 1.2rem; line-height: 1; }
.mlist { list-style: none; margin: 0; padding: 0; }
.mi { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 0; cursor: pointer; color: var(--ink); font: inherit; }
.mi b { display: block; font-weight: 600; }
.mi small { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; }
.mi .arrow { margin-left: auto; color: var(--muted); flex: none; }
.mi.first b { color: var(--green); }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; font: 600 .85rem var(--font-body); padding: 0; margin: 0 0 14px; }
.mtext { display: flex; flex-direction: column; gap: 12px; font-size: .95rem; }
.mtext p, .mtext ul { margin: 0; }
.mtext ul { padding-left: 1.1rem; display: flex; flex-direction: column; gap: 6px; }
.mtext h4 { margin: 8px 0 0; font: 600 .75rem var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mnote { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font: italic 800 1.9rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile span { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.msec { font: 600 .75rem var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 20px 0 6px; }
.srows { list-style: none; margin: 0; padding: 0; }
.srows li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .92rem; }
.srows li b { font-variant-numeric: tabular-nums; text-align: right; }
.srows li small { color: var(--muted); font-weight: 400; margin-left: 6px; }
</style>

<script>
(function () {
  var norm = function (s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  };
  var D = function (name) {
    var extra = Array.prototype.slice.call(arguments, 1);
    var n = norm(name), parts = n.split(" ");
    var keys = [n, parts[parts.length - 1]].concat(extra.map(norm));
    return { name: name, keys: keys.filter(function (k, i) { return keys.indexOf(k) === i; }) };
  };
  var T = function (name) {
    var extra = Array.prototype.slice.call(arguments, 1);
    return { name: name, keys: [norm(name)].concat(extra.map(norm)) };
  };

  var DRIVERS = [
    D("Michael Schumacher"), D("Lewis Hamilton"), D("Max Verstappen"), D("Sebastian Vettel"), D("Fernando Alonso"),

    D("Nigel Mansell"), D("Jackie Stewart"), D("Jim Clark"), D("Juan Manuel Fangio", "el chueco"),
    D("José Froilán González", "froilan", "pepe gonzalez"), D("Carlos Reutemann", "lole"), D("Emerson Fittipaldi"),
    D("James Hunt"), D("Jack Brabham"), D("Mario Andretti"), D("Olivier Panis"), D("Giancarlo Fisichella"),
    D("Robert Kubica"), D("Heikki Kovalainen"), D("Alberto Ascari"), D("Mike Hawthorn"), D("Phil Hill"),
    D("Graham Hill"), D("John Surtees"), D("Jody Scheckter"), D("Stirling Moss")

  var TEAMS = [

    T("Mercedes", "mercedes amg", "mercedes benz"), T("McLaren", "mclaren racing"), T("Renault"),
    T("Brawn GP", "brawn"), T("Williams"), T("Lotus"), T("Alpine"), T("Aston Martin"), T("Haas"), T("Sauber"),
    T("Toyota"), T("Tyrrell"), T("Benetton"), T("Alfa Romeo"), T("Cadillac"), T("Audi"), T("Racing Bulls"),
    T("Jordan"), T("Minardi"), T("Toro Rosso"), T("Force India"), T("Brabham"), T("Cooper")
  ];

  /* ------------------------------------------------------------------
     QUESTION BANK. Each day the game picks 5 questions from this list.
     To add a question, copy one block, give it a new unique "id", and
     add it to the list. Each answer is [name, detail, fame] where
       name   = exactly as written in DRIVERS or TEAMS above,
       detail = the note shown in the review,

  var BANK = [
    {
      id: "q-monaco", title: "Monaco winners",

      pool: DRIVERS,

        ["David Coulthard", "2000, 2002", 15], ["Michael Schumacher", "2001", 55], ["Juan Pablo Montoya", "2003", 4],
        ["Jarno Trulli", "2004", 0], ["Kimi Räikkönen", "2005", 20], ["Fernando Alonso", "2006, 2007", 65],
        ["Lewis Hamilton", "2008, 2016, 2019", 85], ["Jenson Button", "2009", 10], ["Mark Webber", "2010, 2012", 22],
        ["Sebastian Vettel", "2011, 2017", 60], ["Nico Rosberg", "2013, 2014, 2015", 40], ["Daniel Ricciardo", "2018", 45],
        ["Max Verstappen", "2021, 2023", 80], ["Sergio Pérez", "2022", 28], ["Charles Leclerc", "2024", 75],
        ["Lando Norris", "2025", 70], ["Kimi Antonelli", "2026", 30]
      ]
    },
    {

      pool: DRIVERS,
      answers: [
        ["Michael Schumacher", "2000 to 2004", 80], ["Fernando Alonso", "2005, 2006", 62], ["Kimi Räikkönen", "2007", 20],
        ["Lewis Hamilton", "2008, 2014, 2015, 2017 to 2020", 90], ["Jenson Button", "2009", 12], ["Sebastian Vettel", "2010 to 2013", 70],
        ["Nico Rosberg", "2016", 25], ["Max Verstappen", "2021 to 2024", 88], ["Lando Norris", "2025", 60]
      ]
    },
    {

      pool: TEAMS,
      answers: [
        ["Ferrari", "2000 to 2004, 2007, 2008", 85], ["Renault", "2005, 2006", 8], ["Brawn GP", "2009", 3],
        ["Red Bull", "2010 to 2013, 2022, 2023", 70], ["Mercedes", "2014 to 2021", 80], ["McLaren", "2024, 2025", 40]
      ]
    },
    {
      id: "q-argentines", title: "Argentine winners",
      prompt: "Name an Argentine driver who has won a Formula 1 World Championship Grand Prix.",
      pool: DRIVERS,
      answers: [
        ["Juan Manuel Fangio", "24 wins", 90], ["José Froilán González", "2 wins", 0], ["Carlos Reutemann", "12 wins", 25]
      ]
    },
    {
      id: "q-multi", title: "Four titles or more",
      prompt: "Name a driver who has won 4 or more Formula 1 world championships.",
      pool: DRIVERS,
      answers: [
        ["Juan Manuel Fangio", "5 titles", 35], ["Alain Prost", "4 titles", 30], ["Michael Schumacher", "7 titles", 85],
        ["Sebastian Vettel", "4 titles", 60], ["Lewis Hamilton", "7 titles", 90], ["Max Verstappen", "4 titles", 75]
      ]
    },
    {
      id: "q-ferrari", title: "Ferrari champions",
      prompt: "Name a driver who won the Formula 1 drivers' world championship with Ferrari.",
      pool: DRIVERS,
      answers: [
        ["Alberto Ascari", "1952, 1953", 10], ["Juan Manuel Fangio", "1956", 40], ["Mike Hawthorn", "1958", 5],
        ["Phil Hill", "1961", 4], ["John Surtees", "1964", 8], ["Niki Lauda", "1975, 1977", 55],
        ["Jody Scheckter", "1979", 6], ["Michael Schumacher", "2000 to 2004", 90], ["Kimi Räikkönen", "2007", 40]
      ]
    },
    {
      id: "q-monaco3", title: "Monaco regulars",
      prompt: "Name a driver who has won the Monaco Grand Prix 3 or more times.",
      pool: DRIVERS,
      answers: [
        ["Ayrton Senna", "6 wins", 90], ["Michael Schumacher", "5 wins", 55], ["Graham Hill", "5 wins", 15],
        ["Alain Prost", "4 wins", 45], ["Jackie Stewart", "3 wins", 25], ["Stirling Moss", "3 wins", 20],
        ["Lewis Hamilton", "3 wins", 80], ["Nico Rosberg", "3 wins", 30]
      ]
    },
    {
      id: "q-mclaren", title: "McLaren champions",
      prompt: "Name a driver who won the drivers' world championship with McLaren.",
      pool: DRIVERS,
      answers: [
        ["Emerson Fittipaldi", "1974", 15], ["James Hunt", "1976", 25], ["Niki Lauda", "1984", 30],
        ["Alain Prost", "1985, 1986, 1989", 55], ["Ayrton Senna", "1988, 1990, 1991", 85], ["Mika Häkkinen", "1998, 1999", 45],
        ["Lewis Hamilton", "2008", 70], ["Lando Norris", "2025", 65]
      ]
    },
    {
      id: "q-british", title: "British champions",
      prompt: "Name a British driver who has won the Formula 1 drivers' world championship.",
      pool: DRIVERS,
      answers: [
        ["Mike Hawthorn", "1958", 6], ["Graham Hill", "1962, 1968", 20], ["Jim Clark", "1963, 1965", 45],
        ["John Surtees", "1964", 8], ["Jackie Stewart", "1969, 1971, 1973", 45], ["James Hunt", "1976", 40],
        ["Nigel Mansell", "1992", 40], ["Damon Hill", "1996", 35], ["Lewis Hamilton", "2008, 2014, 2015, 2017 to 2020", 95],
        ["Jenson Button", "2009", 35], ["Lando Norris", "2025", 55]
      ]
    },
    {
      id: "q-monaco-teams", title: "Monaco winning teams",
      prompt: "Name a team that has won the Monaco Grand Prix since 2000.",
      pool: TEAMS,
      answers: [
        ["McLaren", "2000, 2002, 2005, 2007, 2008, 2025", 55], ["Ferrari", "2001, 2017, 2024", 80], ["Williams", "2003", 20],
        ["Renault", "2004, 2006", 12], ["Brawn GP", "2009", 5], ["Red Bull", "2010 to 2012, 2018, 2021 to 2023", 70],
        ["Mercedes", "2013 to 2016, 2019, 2026", 65]
      ]
    }
  ];

  /* Optional: force today's questions for a given date (Argentina date, YYYY-MM-DD).
     Example: "2026-12-25": ["q-monaco", "q-champions", "q-ferrari", "q-mclaren", "q-british"]
     Dates that are not listed here pick 5 questions automatically. */
  var SCHEDULE = {};
  var DAILY_COUNT = 5;

  function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function seeded(seed) {
    var a = seed;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  /* The same day always gives the same questions, for every player. */
  function pickRounds(day) {
    var ids = SCHEDULE[day];
    if (ids) {
      var forced = ids.map(function (id) { return BANK.filter(function (q) { return q.id === id; })[0]; }).filter(Boolean);
      if (forced.length) return forced;
    }
    var rnd = seeded(hashStr(day)), pool = BANK.slice(), i, j, t;
    for (i = pool.length - 1; i > 0; i--) { j = Math.floor(rnd() * (i + 1)); t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    return pool.slice(0, Math.min(DAILY_COUNT, pool.length));
  }

  var LIMIT_MS = 30000;
  var LIGHT_STEP = 500;
  var GO_AT = 3200;
  var DAY_MS = 86400000;
  var ART_OFFSET = 3 * 3600000; /* Argentina is UTC-3 all year */
  var STORE_KEY = "gridle-v5";
  var pointsOf = function (a) { return 100 - a[2]; };

  var TIERS = [
    { id: "warmup", name: "Warm-up Lap", min: 0, v: "--t1", sq: "⬜" },
    { id: "pit", name: "Pit Stop", min: 30, v: "--t2", sq: "🟦" },
    { id: "podium", name: "Podium", min: 50, v: "--t3", sq: "🟩" },
    { id: "fastest", name: "Fastest Lap", min: 70, v: "--t4", sq: "🟪" },
    { id: "slam", name: "Grand Slam", min: 90, v: "--t5", sq: "🟨" }
  ];
  function tierOf(pts) {
    var t = TIERS[0];
    TIERS.forEach(function (x) { if (pts >= x.min) t = x; });
    return t;
  }
  function rankFor(total) {
    if (total >= 330) return { v: "--t4", name: "Elite Wheel Knowledge" };
    if (total >= 230) return { v: "--t3", name: "Good Wheel Knowledge" };
    if (total >= 130) return { v: "--t2", name: "Wheel Knowledge" };
    return { v: "--red", name: "DTS Wheel Knowledge" };
  }

  var ROUNDS = [], DIST = [];
  /* Simulated comparison: a crowd picks each answer in proportion to its fame (plus a floor), and 12% miss or run out of time. */
  function buildDist() {
    var dist = [1], MISS = 0.12;
    ROUNDS.forEach(function (r) {
      var ws = r.answers.map(function (a) { return a[2] + 8; });
      var sum = ws.reduce(function (x, y) { return x + y; }, 0);
      var pm = {}; pm[0] = MISS;
      r.answers.forEach(function (a, i) { var p = pointsOf(a); pm[p] = (pm[p] || 0) + (1 - MISS) * ws[i] / sum; });
      var next = []; for (var k = 0; k < dist.length + 101; k++) next.push(0);
      for (var i = 0; i < dist.length; i++) {
        if (!dist[i]) continue;
        for (var p in pm) next[i + Number(p)] += dist[i] * pm[p];
      }
      dist = next;
    });
    return dist;
  }

  /* Edit distance where swapping two neighbouring letters counts as a single edit. */
  function lev(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    for (i = 0; i <= m; i++) d[i] = [i];
    for (j = 1; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
    return d[m][n];
  }
  function find(input, pool) {
    var n = norm(input);
    if (n.length < 2) return null;
    var exact = pool.filter(function (e) { return e.keys.indexOf(n) !== -1; });
    if (exact.length === 1) return { e: exact[0], fuzzy: false };
    if (exact.length > 1) return "ambiguous";
    if (n.length >= 5) {
      var fuzzy = pool.filter(function (e) {
        return e.keys.some(function (k) { return k.length >= 5 && lev(k, n) <= (k.length >= 9 ? 2 : 1); });
      });
      if (fuzzy.length === 1) return { e: fuzzy[0], fuzzy: true };
      if (fuzzy.length > 1) return "ambiguous";
    }
    return null;
  }
  function copyTo(btn, text) {
    var fallback = function () {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); btn.textContent = "Copied"; } catch (e) { btn.textContent = "Select and copy"; }
      document.body.removeChild(ta);
    };
    try {
      navigator.clipboard.writeText(text).then(function () { btn.textContent = "Copied"; }, fallback);
    } catch (e) { fallback(); }
  }

  /* Day boundaries follow Argentina time (UTC-3). */
  function artDay(ms) { return new Date(ms - ART_OFFSET).toISOString().slice(0, 10); }
  function msToNextDay() {
    var art = Date.now() - ART_OFFSET;
    return (Math.floor(art / DAY_MS) + 1) * DAY_MS - art;
  }
  var MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  function parseDay(s) { var p = s.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function fmtDay(ms) { var d = new Date(ms); return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()]; }

  var store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { store = {}; }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
  /* A new day clears the rounds and keeps the streak and history. Returns true when it reset. */
  function ensureDay() {
    var today = artDay(Date.now());
    if (store._day === today) return false;
    var keep = store._meta; store = {}; if (keep) store._meta = keep;
    store._day = today; save();
    return true;
  }
  function setRounds(day) { ROUNDS = pickRounds(day); DIST = buildDist(); view = 0; }
  function st(id) {
    if (!store[id]) store[id] = { g: null, t: 0 };
    return store[id];
  }
  function isOver(r) { return !!st(r.id).g; }
  function isRunning(r) { var s = st(r.id); return !s.g && s.t > 0; }
  function score(r) { var s = st(r.id); return s.g ? s.g.s : 0; }
  function allOver() { return ROUNDS.every(isOver); }
  function anyDone() { return ROUNDS.some(isOver); }
  function firstOpen() { for (var i = 0; i < ROUNDS.length; i++) { if (!isOver(ROUNDS[i])) return i; } return -1; }
  /* A round left running past 30 seconds (closed tab, reload) counts as timed out. */
  function checkExpiry(r) {
    var s = st(r.id);
    if (!s.g && s.t > 0 && Date.now() - s.t >= LIMIT_MS) {
      s.g = { n: "No answer", s: 0, ok: false, to: true };
      save();
      return true;
    }
    return false;
  }
  function updateStreak() {
    var meta = store._meta || { n: 0, last: "" }, today = artDay(Date.now());
    if (meta.last === today) return meta.n;
    var yest = artDay(Date.now() - DAY_MS);
    meta.n = meta.last === yest ? meta.n + 1 : 1;
    meta.best = Math.max(meta.best || 0, meta.n);
    meta.last = today; store._meta = meta; save();
    return meta.n;
  }
  function currentStreak() {
    var meta = store._meta || {};
    return (meta.last === artDay(Date.now()) || meta.last === artDay(Date.now() - DAY_MS)) ? (meta.n || 0) : 0;
  }
  /* Keeps one entry per finished day for the stats window and the home calendar. */
  function recordResult(total, tiers) {
    var meta = store._meta;
    if (!meta) return;
    var today = artDay(Date.now());
    meta.history = meta.history || [];
    var last = meta.history[meta.history.length - 1];
    if (last && last.d === today) return;
    meta.history.push({ d: today, s: total, t: tiers });
    if (meta.history.length > 60) meta.history.shift();
    save();
  }

  var screen = "home", view = 0, cdStart = 0, calOffset = 0;
  var current = null;
  var message = { text: "", cls: "" };
  var timerId = null;

  var homeEl = document.getElementById("home");
  var topEl = document.getElementById("top");
  var stepsEl = document.getElementById("steps");
  var panel = document.getElementById("panel");
  var totalEl = document.getElementById("total");
  var resultsEl = document.getElementById("results");
  var cdEl = document.getElementById("cd");

  function render(focusInput) {
    var total = 0;
    ROUNDS.forEach(function (r) { checkExpiry(r); if (isOver(r)) total += score(r); });
    totalEl.textContent = total;
    if (view > ROUNDS.length - 1) view = ROUNDS.length - 1;
    current = ROUNDS[view];
    if (screen === "results" && !allOver()) screen = "home";
    var home = screen === "home", res = screen === "results", play = screen === "play";
    homeEl.hidden = !home; topEl.hidden = home; stepsEl.hidden = !play; panel.hidden = !play; resultsEl.hidden = !res;
    if (home) { stopTimer(); renderHome(); return; }
    if (res) { stopTimer(); renderResults(total); return; }
    stepsEl.innerHTML = "";
    ROUNDS.forEach(function (r, i) {
      var d = document.createElement("div"), over = isOver(r);
      d.className = "step" + (over ? " done" : (i === view ? " cur" : ""));
      if (over) d.style.setProperty("--tc", st(r.id).g.ok ? "var(" + tierOf(score(r)).v + ")" : "var(--red)");
      d.innerHTML = "<i></i><span></span>";
      d.querySelector("span").textContent = over ? "R" + (i + 1) + " · " + score(r) : "R" + (i + 1);
      stepsEl.appendChild(d);
    });
    renderPanel(focusInput);
  }

  /* Home screen */
  function renderHome() {
    var hist = (store._meta && store._meta.history) || [], byDay = {};
    hist.forEach(function (h) { byDay[h.d] = h.s; });
    var todayMs = parseDay(artDay(Date.now()));
    var dow = (new Date(todayMs).getUTCDay() + 6) % 7;
    var start = todayMs - (dow + 7 + calOffset * 14) * DAY_MS;
    var cells = "", i;
    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d) { cells += '<span class="dow">' + d + "</span>"; });
    for (i = 0; i < 14; i++) {
      var ms = start + i * DAY_MS, key = new Date(ms).toISOString().slice(0, 10), sc = byDay[key];
      var cls = "day" + (ms === todayMs ? " today" : "") + (ms > todayMs ? " future" : "") + (sc !== undefined ? " played" : "");
      var style = "";
      if (sc !== undefined) { var lvl = sc < 130 ? 1 : (sc < 230 ? 2 : (sc < 330 ? 3 : (sc < 430 ? 4 : 5))); style = ' style="--p:' + (lvl * 18) + '%"'; }
      cells += '<div class="' + cls + '"' + style + "><span>" + new Date(ms).getUTCDate() + "</span><b>" + (sc !== undefined ? sc : "—") + "</b></div>";
    }
    var avg = hist.length ? Math.round(hist.reduce(function (t, h) { return t + h.s; }, 0) / hist.length) : 0;
    var note = hist.length ? "Games played: " + hist.length + ". Average score: " + avg + "." : "Finish a game to start your form.";
    var legend = "";
    for (i = 1; i <= 5; i++) legend += '<i style="--p:' + (i * 18) + '%"></i>';
    var label = allOver() ? "See results" : (anyDone() ? "Continue" : "Lights out");
    var arrow = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    var bolt = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';
    var chevL = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
    var chevR = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
    homeEl.innerHTML =
      '<div class="hero"><p class="live"><i></i>Gridle · The daily F1 quiz</p>' +
      '<h2 class="hero-title">Think you<em>know F1?</em></h2>' +
      '<p class="hero-sub">' + ROUNDS.length + " questions. One answer each.<br>30 seconds on the clock.</p>" +
      '<button class="cta" type="button" id="cta"><span>' + label + "</span>" + arrow + "</button></div>" +
      '<section class="form" aria-label="Recent form"><div class="form-head"><h3>Recent form</h3><p class="strk">' + bolt + "<span>" + currentStreak() + "</span><small>day streak</small></p></div>" +
      '<div class="cal-nav"><span>' + fmtDay(start) + " — " + fmtDay(start + 13 * DAY_MS) + '</span><div><button type="button" id="calprev" aria-label="Earlier weeks">' + chevL + '</button><button type="button" id="calnext" aria-label="Later weeks"' + (calOffset === 0 ? " disabled" : "") + ">" + chevR + "</button></div></div>" +
      '<div class="cal">' + cells + '</div><p class="form-note">' + note + '</p><div class="legend"><span>Lower</span>' + legend + '<span>Higher</span><span class="sp">Dash = unplayed</span></div></section>' +
      '<details class="how"><summary>How to play<i></i></summary><div class="mtext">' + INFO_TEXT.how + "</div></details>";
    document.getElementById("cta").addEventListener("click", function () {
      if (allOver()) { screen = "results"; render(false); window.scrollTo(0, 0); }
      else enterRound(firstOpen());
    });
    document.getElementById("calprev").addEventListener("click", function () { calOffset++; renderHome(); });
    document.getElementById("calnext").addEventListener("click", function () { if (calOffset > 0) { calOffset--; renderHome(); } });
  }

  function enterRound(i) {
    view = i; screen = "play"; cdStart = Date.now(); message = { text: "", cls: "" };
    render(false);
    window.scrollTo(0, 0);
  }

  function ptsHtml(sc, g) {
    var label, color = "";
    if (g === "wrong") label = "wrong";
    else { var t = tierOf(sc); label = t.name; color = ' style="color: var(' + t.v + ')"'; }
    return sc + "<small" + color + ">" + label + "</small>";
  }

  function renderResults(total) {
    var streak = updateStreak();
    var rk = rankFor(total), lower = 0, t;
    for (t = 0; t < total && t < DIST.length; t++) lower += DIST[t];
    var pct = (lower * 100).toFixed(1);
    var bins = [], i;
    for (i = 0; i < 50; i++) bins.push(0);
    DIST.forEach(function (m, x) { bins[Math.min(49, Math.floor(x / 10))] += m; });
    var maxBin = Math.max.apply(null, bins), youBin = Math.min(49, Math.floor(total / 10));
    var bars = "", youH = 0;
    bins.forEach(function (m, idx) {
      var h = Math.max(m > 0.0004 ? 2 : 0, Math.round(m / maxBin * 100)), c = idx * 10 + 5;
      var band = c < 130 ? "b-dts" : (c < 230 ? "b-wheel" : (c < 330 ? "b-good" : "b-elite"));
      if (idx === youBin) youH = h;
      bars += '<div class="bar ' + band + (idx === youBin ? " you" : "") + '" style="height:' + h + 'px"></div>';
    });
    var axis = "";
    [0, 100, 200, 300, 400, 500].forEach(function (v) { axis += '<span style="left:' + (v / 5) + '%">' + v + "</span>"; });
    var youLeft = (youBin + 0.5) / 50 * 100;

    var cards = "", squares = "", tierIds = [];
    ROUNDS.forEach(function (r, idx) {
      var g = st(r.id).g, tier = g.ok ? tierOf(g.s) : null;
      var tc = tier ? "var(" + tier.v + ")" : "var(--red)";
      var tname = tier ? tier.name : (g.to ? "Time out" : "Missed");
      squares += tier ? tier.sq : "⬛";
      tierIds.push(tier ? tier.id : "miss");
      var counts = {}, lis = "";
      var sorted = r.answers.slice().sort(function (a, b) { return pointsOf(a) - pointsOf(b); });
      sorted.forEach(function (a) {
        var tr = tierOf(pointsOf(a)); counts[tr.id] = (counts[tr.id] || 0) + 1;
        lis += '<li data-tier="' + tr.id + '" style="--tc: var(' + tr.v + ')"' + (g.ok && g.n === a[0] ? ' class="mine"' : "") + "><span>" + a[0] + "</span><small>" + pointsOf(a) + "</small></li>";
      });
      var chips = "";
      TIERS.forEach(function (tr) {
        if (counts[tr.id]) chips += '<button type="button" class="chip" aria-pressed="false" data-tier="' + tr.id + '" style="--tc: var(' + tr.v + ')">' + tr.name + "<i>" + counts[tr.id] + "</i></button>";
      });
      var mine = g.ok ? r.answers.filter(function (a) { return a[0] === g.n; })[0] : null;
      var yours = mine ? "<p>Your answer: <b>" + g.n + "</b> (" + mine[1] + ")</p>" :
        "<p>Your answer: <b>" + (g.to ? "No answer, time ran out" : g.n + ", not a valid answer") + "</b></p>";
      cards += '<details class="card" style="--tc: ' + tc + '"' + (idx === 0 ? " open" : "") + '><summary><span class="idx">' + (idx + 1) + '</span><span class="dot"></span><span class="tname">' + tname +
        '</span><span class="cpts">' + g.s + "<small>pts</small></span></summary>" +
        '<div class="cbody"><h3>' + r.prompt + "</h3>" + yours + '<p class="vh">Valid answers (' + r.answers.length + ')</p><div class="chips">' + chips + '</div><ul class="vlist">' + lis + "</ul></div></details>";
    });

    resultsEl.innerHTML =
      '<div class="res-head" style="--rc: var(' + rk.v + ')"><h2 class="res-title">Formula 1</h2><p class="res-rank"></p><p class="res-score"></p>' +
      '<p class="streak"><span class="mini-flag"></span><span id="streaktxt"></span></p></div>' +
      '<div class="cmp"><p class="eyebrow">Score comparison</p><p class="pct"><b></b><span>of simulated comparison scores are lower</span></p>' +
      '<div class="hist" aria-hidden="true">' + bars + '<span class="you-tag" style="left:' + youLeft + "%;bottom:" + (youH + 8) + 'px">You</span></div>' +
      '<div class="axis" aria-hidden="true">' + axis + '</div><p class="sim">The comparison is a simulation of players who tend to pick well-known answers. It is not data from real players.</p></div>' +
      '<div class="cards">' + cards + "</div>" +
      '<div class="tools"><button class="btn ghost" type="button" id="resshare">Copy result</button><button class="btn ghost" type="button" id="reshome">Back to home</button></div>';
    recordResult(total, tierIds);
    resultsEl.querySelector(".res-rank").textContent = rk.name;
    resultsEl.querySelector(".res-score").textContent = total;
    resultsEl.querySelector(".pct b").textContent = pct + "%";
    document.getElementById("streaktxt").textContent = streak + "-day streak";
    document.getElementById("resshare").addEventListener("click", function () {
      copyTo(this, "Gridle · Formula 1\n" + total + " points · " + rk.name + "\n" + squares + "\n" + pct + "% of simulated scores are lower\n" + location.href);
    });
    document.getElementById("reshome").addEventListener("click", function () { screen = "home"; render(false); window.scrollTo(0, 0); });
  }
  resultsEl.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    var body = chip.closest(".cbody"), was = chip.getAttribute("aria-pressed") === "true";
    body.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
    if (!was) chip.setAttribute("aria-pressed", "true");
    var tier = was ? null : chip.dataset.tier;
    body.querySelectorAll(".vlist li").forEach(function (li) { li.hidden = tier !== null && li.dataset.tier !== tier; });
  });

  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  /* Start lights: one more lamp every half second, then lights out and the question begins by itself. */
  function cooldownTick() {
    var el = Date.now() - cdStart;
    var lit = Math.min(5, Math.floor(el / LIGHT_STEP));
    var lamps = panel.querySelectorAll(".lamp");
    for (var i = 0; i < lamps.length; i++) lamps[i].className = "lamp" + (i < lit ? " on" : "");
    if (el >= GO_AT) {
      stopTimer(); cdStart = 0;
      var s = st(current.id);
      s.t = Date.now(); s.g = null; message = { text: "", cls: "" };
      save(); render(true);
    }
  }

  function tick() {
    var r = current, s = st(r.id);
    if (!isRunning(r)) { stopTimer(); return; }
    var left = Math.max(0, LIMIT_MS - (Date.now() - s.t));
    if (left <= 0) {
      stopTimer(); checkExpiry(r);
      message = { text: "Time is up. That scores 0 points.", cls: "bad" };
      render(false);
      return;
    }
    var secs = Math.ceil(left / 1000);
    var clock = document.getElementById("clock"), bar = document.getElementById("tbar");
    if (clock) { clock.firstChild.nodeValue = String(secs); clock.className = "clock" + (secs <= 10 ? " low" : ""); }
    if (bar) { bar.firstChild.style.width = (left / LIMIT_MS * 100) + "%"; bar.className = "timebar" + (secs <= 10 ? " low" : ""); }
  }

  function renderPanel(focusInput) {
    stopTimer();
    var r = current, s = st(r.id), over = isOver(r), running = isRunning(r), cooling = !over && !running;
    var html = "", i;
    if (cooling) {
      if (!cdStart) cdStart = Date.now();
      var lampHtml = "";
      for (i = 0; i < 5; i++) lampHtml += '<span class="lamp"></span>';
      html = '<div class="head"><div><p class="eyebrow">Round ' + (view + 1) + " of " + ROUNDS.length + '</p><h2></h2><p class="prompt"></p></div></div>' +
        '<div class="lights big" aria-hidden="true">' + lampHtml + "</div>";
    } else {
      html = '<div class="head"><div><p class="eyebrow">Round ' + (view + 1) + " of " + ROUNDS.length + '</p><h2></h2><p class="prompt"></p></div>' +
        (running ? '<div class="lightbox"><p class="clock" id="clock">30<small>sec</small></p></div>' : "") + "</div>";
      if (running) html += '<div class="timebar" id="tbar"><i></i></div>';
      html += '<div class="score">' + (over ? score(r) : "?") + '<small>' + (over ? "points this round, higher is better" : "points if you are right") + '</small></div>';
      if (running) {
        html += '<form id="form" autocomplete="off" autocapitalize="off" spellcheck="false"><input type="text" id="guess" placeholder="' + (r.pool === TEAMS ? "Type a team" : "Type a driver") + '" aria-label="Your answer">' +
          '<button class="btn" type="submit">Lock in</button></form>';
      }
      html += '<p class="msg ' + message.cls + '" id="msg" role="status" aria-live="polite"></p>';
      if (running) html += '<div class="didyou" id="didyou" hidden><span></span><button class="btn small" type="button" id="yes">Yes, use it</button></div>';
      var rows = "";
      if (running) {
        rows = '<li class="row"><span class="pos">1</span><span class="name"><span class="mask"></span></span><span class="pts"></span></li>';
      } else {
        var g = s.g, picked = g.ok ? g.n : null;
        var sorted = r.answers.slice().sort(function (a, b) { return pointsOf(b) - pointsOf(a); });
        sorted.forEach(function (a, idx) {
          var isPick = a[0] === picked;
          rows += '<li class="row ' + (isPick ? "hit" : "other") + '"><span class="pos">' + (idx + 1) + '</span><span class="name">' + a[0] +
            "<small>" + a[1] + (isPick ? " · your answer" : "") + '</small></span><span class="pts">' + ptsHtml(pointsOf(a)) + "</span></li>";
        });
        if (!g.ok) {
          rows += '<li class="row miss"><span class="pos">×</span><span class="name">' + g.n +
            "<small>" + (g.to ? "Time ran out" : "Your answer, not a valid one") + '</small></span><span class="pts">' + ptsHtml(0, "wrong") + "</span></li>";
        }
      }
      html += '<ol class="board">' + rows + '</ol>';
      if (over) {
        var best = Math.max.apply(null, r.answers.map(pointsOf));
        var sc = score(r);
        var finish = sc === 100 ? "Grand Slam! You found the most obscure answer, worth the maximum 100." :
          (!s.g.ok ? "No points this round. The best possible answer was worth " + best + "." : "You scored " + sc + ". The best possible answer was worth " + best + ".");
        html += '<div class="finish"><span class="flag"></span><p>' + finish + '</p></div>' +
          '<button class="btn big" type="button" id="next">' + (view < ROUNDS.length - 1 ? "Next round" : "See results") + '</button>';
      }
    }
    panel.innerHTML = html;
    panel.querySelector("h2").textContent = cooling ? "Get ready" : r.title;
    panel.querySelector(".prompt").textContent = cooling ? "The question appears when the lights go out." : r.prompt;
    var msgEl = document.getElementById("msg"); if (msgEl) msgEl.textContent = message.text;
    wire();
    if (cooling) { timerId = setInterval(cooldownTick, 100); cooldownTick(); }
    else if (running) { timerId = setInterval(tick, 250); tick(); if (focusInput) document.getElementById("guess").focus(); }
  }

  function lockIn(text) {
    var r = current;
    if (!isRunning(r)) return;
    var hit = find(text, r.pool);
    hideSuggestion();
    if (hit === null) { message = { text: "I don't recognise that name. Try first and last name. The clock is still running.", cls: "" }; renderPanelKeepTimer(); return; }
    if (hit === "ambiguous") { message = { text: "More than one match. Type the full name.", cls: "" }; renderPanelKeepTimer(); return; }
    if (hit.fuzzy) { message = { text: "That spelling is not quite right. The clock is still running.", cls: "" }; renderPanelKeepTimer(); showSuggestion(hit.e.name); return; }
    commit(hit.e);
  }
  function commit(hit) {
    var r = current, s = st(r.id);
    if (!isRunning(r)) return;
    var ans = r.answers.filter(function (a) { return a[0] === hit.name; })[0];
    if (ans) {
      var pts = pointsOf(ans);
      s.g = { n: hit.name, s: pts, ok: true };
      message = { text: hit.name + " is correct. " + pts + " points (" + tierOf(pts).name + ").", cls: "good" };
    } else {
      s.g = { n: hit.name, s: 0, ok: false };
      message = { text: hit.name + " does not fit the question. 0 points.", cls: "bad" };
    }
    save(); render(false);
  }
  /* Updates only the message so the input keeps its text and the clock keeps running. */
  function renderPanelKeepTimer() {
    var msgEl = document.getElementById("msg");
    if (msgEl) { msgEl.textContent = message.text; msgEl.className = "msg " + message.cls; }
  }
  /* Typo detection: a near miss is never auto-accepted. The player confirms the suggested name. */
  var pendingName = "";
  function showSuggestion(name) {
    var box = document.getElementById("didyou");
    if (!box) return;
    pendingName = name;
    box.querySelector("span").textContent = "Did you mean " + name + "?";
    box.hidden = false;
  }
  function hideSuggestion() {
    pendingName = "";
    var box = document.getElementById("didyou");
    if (box) box.hidden = true;
  }

  function wire() {
    var next = document.getElementById("next");
    if (next) next.addEventListener("click", function () {
      message = { text: "", cls: "" };
      if (view < ROUNDS.length - 1) enterRound(view + 1);
      else { screen = "results"; render(false); window.scrollTo(0, 0); }
    });
    var form = document.getElementById("form"), input = document.getElementById("guess");
    if (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var v = input.value.trim();
        if (v) lockIn(v);
      });
      input.addEventListener("input", hideSuggestion);
      document.getElementById("yes").addEventListener("click", function () {
        var name = pendingName; hideSuggestion();
        var entry = current.pool.filter(function (e) { return e.name === name; })[0];
        if (entry) commit(entry);
      });
    }
  }

  /* Info and stats windows */
  var overlay = document.getElementById("overlay"), modalBody = document.getElementById("modalbody"), openerEl = null;
  var ARROW = '<svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var INFO_ITEMS = [
    { id: "play", title: "Play today", sub: "The daily F1 quiz." },
    { id: "how", title: "How to play", sub: "Rules, scoring and ranks." },
    { id: "about", title: "About", sub: "The game and how the numbers work." },
    { id: "faq", title: "FAQ", sub: "Answers about scores and progress." },
    { id: "privacy", title: "Privacy", sub: "What is stored in your browser." }
  ];
  var INFO_TEXT = {
    how: "<ul><li>Play 5 rounds, one at a time. Each round asks one question.</li>" +
      "<li>Each round starts by itself after a short countdown of start lights. When the lights go out, you get one answer and 30 seconds.</li>" +
      "<li>A correct answer scores more the less well known it is, up to 100 points. A wrong answer, or no answer, scores 0.</li>" +
      "<li>If you misspell a name slightly, the game suggests the name it thinks you meant. Confirm it before the clock runs out.</li></ul>" +
      "<h4>Answer tiers</h4><ul><li>Warm-up Lap: under 30 points</li><li>Pit Stop: 30 to 49</li><li>Podium: 50 to 69</li><li>Fastest Lap: 70 to 89</li><li>Grand Slam: 90 to 100</li></ul>" +
      "<h4>Ranks, from your total after 5 rounds</h4><ul><li>Elite Wheel Knowledge: 330 or more</li><li>Good Wheel Knowledge: 230 to 329</li><li>Wheel Knowledge: 130 to 229</li><li>DTS Wheel Knowledge: under 130</li></ul>",
    about: "<p>Gridle is a daily Formula 1 quiz with Pointless-style scoring: the rarer your correct answer, the better.</p>" +
      "<p>The race facts were put together with AI help and may contain mistakes.</p>" +
      "<p>How well known each answer is, which sets its points, is an estimate and not a survey. The comparison chart on the results screen is a simulation of players who favour well-known answers. It is not data from real players.</p>",
    faq: "<h4>When does the game reset?</h4><p>At 00:00 Argentina time. The countdown at the bottom shows the time left.</p>" +
      "<h4>Do the questions change every day?</h4><p>Yes. Each day uses a different mix of five questions from a bank, the same for everyone. Some questions come back after a few days.</p>" +
      "<h4>Can I replay today's game?</h4><p>No. You get one attempt per day.</p>" +
      "<h4>What if I close the page during a round?</h4><p>The 30 seconds keep running. If they pass, the round scores 0.</p>" +
      "<h4>How does the streak work?</h4><p>Finish all 5 rounds on consecutive days to extend it. Missing a day starts it again at 1.</p>",
    privacy: "<p>Your progress, streak and stats are saved only in this browser, using local storage. Nothing is sent to a server. Clearing your browser data erases them.</p>"
  };
  function openModal(kind, btn) {
    openerEl = btn; overlay.hidden = false;
    if (kind === "stats") renderStats(); else renderInfoMenu();
    document.getElementById("mclose").focus();
  }
  function closeModal() { overlay.hidden = true; if (openerEl) openerEl.focus(); }
  function renderInfoMenu() {
    var items = INFO_ITEMS.map(function (it, i) {
      return '<li><button type="button" class="mi' + (i === 0 ? " first" : "") + '" data-id="' + it.id + '"><span><b>' + it.title + "</b><small>" + it.sub + "</small></span>" + ARROW + "</button></li>";
    }).join("");
    modalBody.innerHTML = '<h2 id="mtitle">Inside Gridle</h2><ul class="mlist">' + items + "</ul>";
    modalBody.querySelectorAll(".mi").forEach(function (b) {
      b.addEventListener("click", function () { if (b.dataset.id === "play") closeModal(); else renderInfoDetail(b.dataset.id); });
    });
  }
  function renderInfoDetail(id) {
    var it = INFO_ITEMS.filter(function (x) { return x.id === id; })[0];
    modalBody.innerHTML = '<button type="button" class="back" id="mback">← Back</button><h2 id="mtitle">' + it.title + '</h2><div class="mtext">' + INFO_TEXT[id] + "</div>";
    document.getElementById("mback").addEventListener("click", renderInfoMenu);
  }
  function renderStats() {
    var meta = store._meta || {}, hist = meta.history || [];
    var streakNow = currentStreak();
    var best = Math.max(meta.best || 0, streakNow);
    var played = hist.length, sum = 0, top = 0;
    hist.forEach(function (h) { sum += h.s; if (h.s > top) top = h.s; });
    var avg = played ? Math.round(sum / played) : 0;
    var tiles = [["Games", played], ["Streak", streakNow], ["Best streak", best], ["Average", avg], ["Best score", top]].map(function (x) {
      return '<div class="tile"><b>' + x[1] + "</b><span>" + x[0] + "</span></div>";
    }).join("");
    var ranks = [["Elite Wheel Knowledge", "--t4"], ["Good Wheel Knowledge", "--t3"], ["Wheel Knowledge", "--t2"], ["DTS Wheel Knowledge", "--red"]];
    var rankRows = ranks.map(function (rk) {
      var c = hist.filter(function (h) { return rankFor(h.s).name === rk[0]; }).length;
      return '<li><span style="color: var(' + rk[1] + ')">' + rk[0] + "</span><b>" + c + "</b></li>";
    }).join("");
    var tierCounts = {};
    hist.forEach(function (h) { (h.t || []).forEach(function (id) { tierCounts[id] = (tierCounts[id] || 0) + 1; }); });
    var tierRows = TIERS.slice().reverse().map(function (tr) {
      return '<li><span style="color: var(' + tr.v + ')">' + tr.name + "</span><b>" + (tierCounts[tr.id] || 0) + "</b></li>";
    }).join("") + '<li><span style="color: var(--red)">Missed or timed out</span><b>' + (tierCounts.miss || 0) + "</b></li>";
    var recent = hist.slice(-7).reverse().map(function (h) {
      return "<li><span>" + h.d + "</span><b>" + h.s + "<small>" + rankFor(h.s).name + "</small></b></li>";
    }).join("");
    modalBody.innerHTML = '<h2 id="mtitle">Your stats</h2>' + (played ? "" : '<p class="mnote">Finish all five rounds to start building your stats.</p>') +
      '<div class="tiles">' + tiles + '</div><h3 class="msec">Ranks earned</h3><ul class="srows">' + rankRows + '</ul><h3 class="msec">Answers by tier</h3><ul class="srows">' + tierRows + "</ul>" +
      (played ? '<h3 class="msec">Recent games</h3><ul class="srows">' + recent + "</ul>" : "");
  }
  document.getElementById("btn-info").addEventListener("click", function () { openModal("info", this); });
  document.getElementById("btn-stats").addEventListener("click", function () { openModal("stats", this); });
  document.getElementById("mclose").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !overlay.hidden) closeModal(); });

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function tickCountdown() {
    if (ensureDay()) { setRounds(store._day); screen = "home"; message = { text: "", cls: "" }; cdStart = 0; render(false); }
    var s = Math.max(0, Math.floor(msToNextDay() / 1000));
    cdEl.textContent = pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
  }

  ensureDay();
  setRounds(store._day);
  render(false);
  tickCountdown();
  setInterval(tickCountdown, 1000);
})();
</script>

</body>
</html>
